<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Builder DNA — project experience radar</title>
  <desc id="desc">An asymmetric radar chart with the greatest emphasis on automation and desktop tools, followed by web, mobile, applied AI, and backend. A qualitative interpretation of project experience, not measured proficiency scores.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30434C"/>
    </pattern>
    <linearGradient id="area" x1="600" y1="177" x2="600" y2="493" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8F2D3" stop-opacity=".55"/>
      <stop offset="1" stop-color="#64CDBD" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="edge" x1="600" y1="177" x2="509.9" y2="493" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAC59C"/>
      <stop offset=".35" stop-color="#B8F2D3"/>
      <stop offset="1" stop-color="#72D6C5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" rx="20" fill="#101C24"/>
  <rect x="374" y="149" width="452" height="439" fill="url(#dots)"/>

  <path d="M48 49H68" stroke="#B8F2D3" stroke-width="3"/>
  <text x="80" y="55" fill="#D5E2E7" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="3">BUILDER DNA</text>
  <text x="1152" y="55" text-anchor="end" fill="#8EA7B4" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2">PROJECT EXPERIENCE</text>

  <!-- Grid spacing is a visual reference. The profile is a qualitative summary. -->
  <g stroke="#38514F" stroke-width="1.3">
    <path d="M600 325L634.64 345V385L600 405L565.36 385V345Z"/>
    <path d="M600 285L669.28 325V405L600 445L530.72 405V325Z"/>
    <path d="M600 245L703.92 305V425L600 485L496.08 425V305Z"/>
    <path d="M600 205L738.56 285V445L600 525L461.44 445V285Z"/>
  </g>
  <path d="M600 165L773.2 265V465L600 565L426.8 465V265Z" stroke="#648578" stroke-width="1.8"/>
  <path d="M600 165V565M426.8 265L773.2 465M426.8 465L773.2 265" stroke="#48645D" stroke-width="1.3" stroke-dasharray="4 7"/>

  <!-- Only broad experience categories are published; no source project identifiers. -->
  <path d="M600 177L748.95 279L735.1 443L600 493L509.93 417L527.25 323Z" fill="url(#area)"/>
  <path d="M600 177L748.95 279L735.1 443L600 493L509.93 417L527.25 323Z" stroke="#B8F2D3" stroke-opacity=".07" stroke-width="16" stroke-linejoin="round"/>
  <path d="M600 177L748.95 279L735.1 443L600 493L509.93 417L527.25 323Z" stroke="url(#edge)" stroke-width="3.5" stroke-linejoin="round"/>
  <g fill="#101C24" stroke="#B8F2D3" stroke-width="3">
    <circle cx="748.95" cy="279" r="6"/>
    <circle cx="735.1" cy="443" r="6"/>
    <circle cx="600" cy="493" r="6"/>
    <circle cx="509.93" cy="417" r="6"/>
    <circle cx="527.25" cy="323" r="6"/>
  </g>
  <circle cx="600" cy="177" r="17" fill="#EAC59C" fill-opacity=".10"/>
  <circle cx="600" cy="177" r="8" fill="#EAC59C" stroke="#101C24" stroke-width="3"/>
  <circle cx="600" cy="365" r="3" fill="#B8F2D3" fill-opacity=".65"/>

  <path d="M426.8 265H405M426.8 465H405M773.2 265H795M773.2 465H795" stroke="#648578" stroke-width="1.8"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="600" y="108" text-anchor="middle" fill="#EAC59C" font-size="25" font-weight="700" letter-spacing="2">AUTOMATION</text>
    <text x="600" y="138" text-anchor="middle" fill="#A6BAC5" font-size="20">Make repetitive work disappear</text>
    <text x="818" y="253" fill="#B8F2D3" font-size="25" font-weight="700" letter-spacing="2">DESKTOP</text>
    <text x="818" y="284" fill="#A6BAC5" font-size="20">Windows utilities</text>
    <text x="818" y="453" fill="#F3F5ED" font-size="25" font-weight="700" letter-spacing="2">WEB</text>
    <text x="818" y="484" fill="#A6BAC5" font-size="20">Interfaces &amp; tools</text>
    <text x="600" y="611" text-anchor="middle" fill="#F3F5ED" font-size="25" font-weight="700" letter-spacing="2">MOBILE</text>
    <text x="600" y="642" text-anchor="middle" fill="#A6BAC5" font-size="20">Android apps</text>
    <text x="382" y="453" text-anchor="end" fill="#F3F5ED" font-size="25" font-weight="700" letter-spacing="2">AI / RAG</text>
    <text x="382" y="484" text-anchor="end" fill="#A6BAC5" font-size="20">Applied AI</text>
    <text x="382" y="253" text-anchor="end" fill="#F3F5ED" font-size="25" font-weight="700" letter-spacing="2">BACKEND</text>
    <text x="382" y="284" text-anchor="end" fill="#A6BAC5" font-size="20">APIs &amp; data</text>
  </g>
  <path d="M48 684H1152" stroke="#2F454C"/>
  <circle cx="59" cy="720" r="5" fill="#B8F2D3"/>
  <text x="77" y="726" fill="#A6BAC5" font-family="Arial, Helvetica, sans-serif" font-size="18">Relative project focus</text>
  <text x="1152" y="726" text-anchor="end" fill="#8EA7B4" font-family="Arial, Helvetica, sans-serif" font-size="18">Qualitative overview · not a proficiency score</text>
</svg>

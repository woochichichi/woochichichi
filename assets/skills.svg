<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Skill Hexagon — six areas of project experience</title>
  <desc id="desc">A hexagonal map of technologies used in public projects: AI and RAG, backend, web, mobile, automation, and desktop. The diagram shows categories, not proficiency scores.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30434C"/>
    </pattern>
  </defs>
  <rect width="1200" height="580" rx="20" fill="#101C24"/>
  <rect x="400" y="88" width="400" height="398" fill="url(#dots)"/>

  <!-- Six equal axes describe areas of experience, not a numerical rating. -->
  <path d="M600 115L747.2 200V370L600 455L452.8 370V200Z" fill="#B8F2D3" fill-opacity=".06" stroke="#6A9A88" stroke-width="2"/>
  <path d="M600 285V115L747.2 200Z" fill="#B8F2D3" fill-opacity=".05"/>
  <path d="M600 285L747.2 370L600 455Z" fill="#B8F2D3" fill-opacity=".05"/>
  <path d="M600 285L452.8 370V200Z" fill="#B8F2D3" fill-opacity=".05"/>
  <path d="M600 115V455M452.8 200L747.2 370M452.8 370L747.2 200" stroke="#44645D" stroke-width="1.5"/>
  <path d="M600 200L673.6 242.5V327.5L600 370L526.4 327.5V242.5Z" fill="#1B3035" stroke="#739F8C" stroke-width="1.5"/>
  <text x="600" y="278" text-anchor="middle" fill="#F3F5ED" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="5">BUILD</text>
  <text x="600" y="315" text-anchor="middle" fill="#B8F2D3" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="5">SKILLS</text>

  <path d="M452.8 200H420M452.8 370H420M747.2 200H780M747.2 370H780" stroke="#6A9A88" stroke-width="2"/>
  <g fill="#101C24" stroke="#B8F2D3" stroke-width="3">
    <circle cx="600" cy="115" r="8"/>
    <circle cx="747.2" cy="200" r="8"/>
    <circle cx="747.2" cy="370" r="8"/>
    <circle cx="600" cy="455" r="8"/>
    <circle cx="452.8" cy="370" r="8"/>
    <circle cx="452.8" cy="200" r="8"/>
  </g>
  <g fill="#EAC59C">
    <circle cx="600" cy="115" r="3"/>
    <circle cx="747.2" cy="370" r="3"/>
    <circle cx="452.8" cy="370" r="3"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="600" y="49" text-anchor="middle" fill="#B8F2D3" font-size="25" font-weight="700" letter-spacing="2">AI / RAG</text>
    <text x="600" y="80" text-anchor="middle" fill="#A6BAC5" font-size="21">Python · ChromaDB</text>

    <text x="803" y="191" fill="#F3F5ED" font-size="25" font-weight="700" letter-spacing="2">BACKEND</text>
    <text x="803" y="222" fill="#A6BAC5" font-size="21">Python · FastAPI</text>

    <text x="803" y="361" fill="#F3F5ED" font-size="25" font-weight="700" letter-spacing="2">WEB</text>
    <text x="803" y="392" fill="#A6BAC5" font-size="21">JavaScript · React · Vite</text>

    <text x="600" y="512" text-anchor="middle" fill="#B8F2D3" font-size="25" font-weight="700" letter-spacing="2">MOBILE</text>
    <text x="600" y="544" text-anchor="middle" fill="#A6BAC5" font-size="21">Kotlin · Android</text>

    <text x="397" y="361" text-anchor="end" fill="#F3F5ED" font-size="25" font-weight="700" letter-spacing="2">AUTOMATION</text>
    <text x="397" y="392" text-anchor="end" fill="#A6BAC5" font-size="21">SMS · Telegram Bot</text>

    <text x="397" y="191" text-anchor="end" fill="#F3F5ED" font-size="25" font-weight="700" letter-spacing="2">DESKTOP</text>
    <text x="397" y="222" text-anchor="end" fill="#A6BAC5" font-size="21">C# · WinForms · Electron</text>
  </g>
</svg>
